name: backend-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'pactogg-api' }}
  INSTANCE_IDS: ${{ vars.INSTANCE_IDS }}
  PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
  TRIVY_VERSION: "0.69.3"
  SEMGREP_VERSION: "1.95.0"
  DOCKLE_VERSION: "v0.4.14"

jobs:
  build-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Pactogg.sln

      - name: Build
        run: dotnet build Pactogg.sln -c Release --no-restore

      - name: Test all projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults
          for project in \
            UnitTest/UnitTest.csproj \
            IntegrationTest/IntegrationTest.csproj \
            SecurityTest/SecurityTest.csproj \
            ContractTest/ContractTest.csproj \
            DatabaseTest/DatabaseTest.csproj \
            MutationTest/MutationTest.csproj \
            PerformanceTest/PerformanceTest.csproj; do
            name="$(basename "$project" .csproj)"
            dotnet test "$project" -c Release --no-build \
              --results-directory TestResults \
              --logger "trx;LogFileName=${name}.trx"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  sast:
    name: sast-codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4

  semgrep:
    name: sast-semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # Reglas de C#, secretos y OWASP. Falla solo con hallazgos de severidad ERROR.
      - name: Semgrep scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:${SEMGREP_VERSION} \
            semgrep scan --config p/csharp --config p/secrets --config p/owasp-top-ten \
            --exclude IntegrationTest --exclude UnitTest --exclude SecurityTest \
            --sarif --output semgrep.sarif --metrics off || true
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:${SEMGREP_VERSION} \
            semgrep scan --config p/csharp --config p/secrets --config p/owasp-top-ten \
            --exclude IntegrationTest --exclude UnitTest --exclude SecurityTest \
            --severity ERROR --error --metrics off

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    name: sca-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Pactogg.sln

      - name: NuGet vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          output="$(dotnet list Pactogg.sln package --vulnerable --include-transitive)"
          printf '%s\n' "$output"
          if grep -q "has the following vulnerable packages" <<<"$output"; then
            echo "Se encontraron paquetes vulnerables." >&2
            exit 1
          fi

      # Trivy por imagen oficial fijada (0.69.3 no afectada por GHSA-69fq-xp46-6x23);
      # se evita trivy-action/setup-trivy, cuyo instalador falla tras el incidente.
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:${TRIVY_VERSION} \
            fs --scanners vuln,secret --severity CRITICAL,HIGH --ignore-unfixed \
            --format sarif --output /work/trivy-fs.sarif --exit-code 0 .
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:${TRIVY_VERSION} \
            fs --scanners vuln,secret --severity CRITICAL,HIGH --ignore-unfixed \
            --format table --exit-code 1 .

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif


  terraform:
    name: terraform-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deploy/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

  # Compuerta de calidad: un solo check obligatorio para proteger main.
  # Pasa solo si pruebas, CodeQL, Semgrep, dependencias/Trivy y Terraform pasaron.
  quality-gate:
    name: quality-gate
    needs: [build-test, sast, semgrep, sca, terraform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          failed = [name for name, job in needs.items() if job["result"] != "success"]
          for name, job in needs.items():
              print(name + ": " + job["result"])
          if failed:
              sys.exit("Compuerta cerrada: " + ", ".join(failed))
          print("Compuerta abierta.")
          '

  docker:
    name: docker-build-scan-push
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "pactogg-api:${GITHUB_SHA}" .

      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work \
            aquasec/trivy:${TRIVY_VERSION} image --severity CRITICAL,HIGH --ignore-unfixed \
            --format sarif --output /work/trivy-image.sarif --exit-code 0 "pactogg-api:${GITHUB_SHA}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:${TRIVY_VERSION} image --severity CRITICAL,HIGH --ignore-unfixed \
            --format table --exit-code 1 "pactogg-api:${GITHUB_SHA}"

      # Buenas prácticas de la imagen (CIS Docker Benchmark). Falla con hallazgos FATAL.
      - name: Dockle image lint
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:${DOCKLE_VERSION} --exit-code 1 --exit-level fatal \
            "pactogg-api:${GITHUB_SHA}"

      - name: Upload image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "ECR_REGISTRY=${registry}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "pactogg-api:${GITHUB_SHA}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "pactogg-api:${GITHUB_SHA}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        shell: bash
        run: |
          set -euo pipefail
          docker tag "pactogg-api:${GITHUB_SHA}" "${DOCKERHUB_USERNAME}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "pactogg-api:${GITHUB_SHA}" "${DOCKERHUB_USERNAME}/${ECR_REPOSITORY}:latest"
          docker push "${DOCKERHUB_USERNAME}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "${DOCKERHUB_USERNAME}/${ECR_REPOSITORY}:latest"

  deploy:
    name: deploy-ec2-ssm
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Redeploy both instances via SSM
        shell: bash
        run: |
          set -euo pipefail
          # Las instancias se buscan por etiqueta: si infra.yml recrea la infraestructura, los IDs cambian.
          discovered="$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=pactogg" "Name=tag:Role,Values=api" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          INSTANCE_IDS="${discovered:-${INSTANCE_IDS:-}}"
          : "${INSTANCE_IDS:?No se encontraron instancias de la API}"
          # shellcheck disable=SC2086
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --comment "pactogg redeploy ${GITHUB_SHA}" \
            --instance-ids $INSTANCE_IDS \
            --parameters 'commands=["sudo /opt/pactogg/redeploy.sh"]' \
            --query Command.CommandId --output text)"
          echo "SSM command: ${command_id}"
          for id in $INSTANCE_IDS; do
            status=Pending
            for _ in $(seq 1 60); do
              status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$id" \
                --query Status --output text 2>/dev/null || echo Pending)"
              case "$status" in
                Success) echo "$id: OK"; break ;;
                Failed|Cancelled|TimedOut) echo "$id: $status" >&2; exit 1 ;;
              esac
              sleep 10
            done
            [ "$status" = "Success" ] || { echo "$id: timeout" >&2; exit 1; }
          done

  smoke:
    name: smoke-test
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          base="${PUBLIC_BASE_URL:-}"
          if [ -z "$base" ]; then
            # Sin dominio propio la URL es <ip-con-guiones>.sslip.io del gateway.
            ip="$(aws ec2 describe-addresses --filters "Name=tag:Name,Values=pactogg-prod-gateway" \
              --query 'Addresses[0].PublicIp' --output text)"
            base="https://${ip//./-}.sslip.io"
          fi
          base="${base%/}"
          echo "Probando ${base}/health"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "${base}/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "La API no respondió al health check." >&2
          exit 1
