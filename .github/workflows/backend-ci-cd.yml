name: backend-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'pactogg-api' }}
  ASG_NAME: ${{ vars.ASG_NAME }}
  PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}

jobs:
  build-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Pactogg.sln

      - name: Build
        run: dotnet build Pactogg.sln -c Release --no-restore

      - name: Test all projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults
          for project in \
            UnitTest/UnitTest.csproj \
            IntegrationTest/IntegrationTest.csproj \
            SecurityTest/SecurityTest.csproj \
            ContractTest/ContractTest.csproj \
            DatabaseTest/DatabaseTest.csproj \
            MutationTest/MutationTest.csproj \
            PerformanceTest/PerformanceTest.csproj; do
            name="$(basename "$project" .csproj)"
            dotnet test "$project" -c Release --no-build \
              --results-directory TestResults \
              --logger "trx;LogFileName=${name}.trx"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  sast:
    name: sast-codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3

  sca:
    name: sca-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Pactogg.sln

      - name: NuGet vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          output="$(dotnet list Pactogg.sln package --vulnerable --include-transitive)"
          printf '%s\n' "$output"
          if grep -q "has the following vulnerable packages" <<<"$output"; then
            echo "Se encontraron paquetes vulnerables." >&2
            exit 1
          fi

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif


  terraform:
    name: terraform-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deploy/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

  docker:
    name: docker-build-scan-push
    needs: [build-test, sast, sca, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "pactogg-api:${GITHUB_SHA}" .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pactogg-api:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "ECR_REGISTRY=${registry}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "pactogg-api:${GITHUB_SHA}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "pactogg-api:${GITHUB_SHA}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        shell: bash
        run: |
          set -euo pipefail
          docker tag "pactogg-api:${GITHUB_SHA}" "${DOCKERHUB_USERNAME}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "pactogg-api:${GITHUB_SHA}" "${DOCKERHUB_USERNAME}/${ECR_REPOSITORY}:latest"
          docker push "${DOCKERHUB_USERNAME}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "${DOCKERHUB_USERNAME}/${ECR_REPOSITORY}:latest"

  deploy:
    name: deploy-ec2-asg
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Refresh ASG instances
        shell: bash
        run: |
          set -euo pipefail
          : "${ASG_NAME:?Define la variable ASG_NAME con el output autoscaling_group_name}"
          refresh_id="$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":300}' \
            --query InstanceRefreshId \
            --output text)"
          echo "Instance refresh: ${refresh_id}"

          for _ in $(seq 1 60); do
            status="$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$refresh_id" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)"
            echo "Estado: ${status}"
            case "$status" in
              Successful) exit 0 ;;
              Failed|Cancelled|RollbackFailed) exit 1 ;;
            esac
            sleep 20
          done

          echo "Timeout esperando el instance refresh." >&2
          exit 1

  smoke:
    name: smoke-test
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          : "${PUBLIC_BASE_URL:?Define la variable PUBLIC_BASE_URL con https://domain_name}"
          base="${PUBLIC_BASE_URL%/}"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "${base}/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "La API no respondió al health check." >&2
          exit 1
