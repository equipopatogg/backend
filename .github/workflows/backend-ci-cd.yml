name: backend-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'pactogg-api' }}
  INSTANCE_IDS: ${{ vars.INSTANCE_IDS }}
  PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
  TRIVY_VERSION: "0.69.3"
  SEMGREP_VERSION: "1.95.0"
  DOCKLE_VERSION: "v0.4.14"
  GITLEAKS_VERSION: "v8.21.2"
  CHECKOV_VERSION: "3.2.334"
  CYCLONEDX_VERSION: "4.1.0"
  ZAP_IMAGE: "ghcr.io/zaproxy/zaproxy:2.15.0"

jobs:
  build-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Pactogg.sln

      - name: Build
        run: dotnet build Pactogg.sln -c Release --no-restore

      - name: Test all projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults
          for project in \
            UnitTest/UnitTest.csproj \
            IntegrationTest/IntegrationTest.csproj \
            SecurityTest/SecurityTest.csproj \
            ContractTest/ContractTest.csproj \
            DatabaseTest/DatabaseTest.csproj \
            MutationTest/MutationTest.csproj \
            PerformanceTest/PerformanceTest.csproj; do
            name="$(basename "$project" .csproj)"
            dotnet test "$project" -c Release --no-build \
              --results-directory TestResults \
              --logger "trx;LogFileName=${name}.trx"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  sast:
    name: sast-codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: csharp

      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

  semgrep:
    name: sast-semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Reglas de C#, secretos y OWASP. Falla solo con hallazgos de severidad ERROR.
      - name: Semgrep scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:${SEMGREP_VERSION} \
            semgrep scan --config p/csharp --config p/secrets --config p/owasp-top-ten \
            --exclude IntegrationTest --exclude UnitTest --exclude SecurityTest \
            --sarif --output semgrep.sarif --metrics off || true
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:${SEMGREP_VERSION} \
            semgrep scan --config p/csharp --config p/secrets --config p/owasp-top-ten \
            --exclude IntegrationTest --exclude UnitTest --exclude SecurityTest \
            --severity ERROR --error --metrics off

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    name: sca-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Pactogg.sln

      - name: NuGet vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          output="$(dotnet list Pactogg.sln package --vulnerable --include-transitive)"
          printf '%s\n' "$output"
          if grep -q "has the following vulnerable packages" <<<"$output"; then
            echo "Se encontraron paquetes vulnerables." >&2
            exit 1
          fi

      # Trivy por imagen oficial fijada (0.69.3 no afectada por GHSA-69fq-xp46-6x23);
      # se evita trivy-action/setup-trivy, cuyo instalador falla tras el incidente.
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:${TRIVY_VERSION} \
            fs --scanners vuln,secret --severity CRITICAL,HIGH --ignore-unfixed \
            --format sarif --output /work/trivy-fs.sarif --exit-code 0 .
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:${TRIVY_VERSION} \
            fs --scanners vuln,secret --severity CRITICAL,HIGH --ignore-unfixed \
            --format table --exit-code 1 .

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-fs.sarif

      # SBOM CycloneDX (DESC_BACK 12, CLARIFICACION cadena de suministro).
      - name: SBOM CycloneDX
        run: |
          dotnet tool install --global CycloneDX --version "${CYCLONEDX_VERSION}"
          dotnet CycloneDX Pactogg.Api/Pactogg.Api.csproj --output sbom --filename pactogg-api.cdx.json --json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom/pactogg-api.cdx.json
          retention-days: 30

  # Escaneo de secretos en todo el historial con Gitleaks (imagen fijada; sin licencia de la acción).
  secrets:
    name: secrets-gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION} \
            git --redact --verbose --exit-code 1 /repo

  # Escaneo de IaC (Terraform y Dockerfile) con Checkov. Falla con hallazgos no justificados.
  iac:
    name: iac-checkov
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkov
        run: |
          pip install --quiet "checkov==${CHECKOV_VERSION}"
          checkov --directory deploy --file Dockerfile --framework terraform dockerfile \
            --config-file .checkov.yaml --output cli --output sarif --output-file-path console,checkov.sarif

      # Checkov escribe el SARIF como archivo (no carpeta) en la ruta indicada.
      - name: Locate Checkov SARIF
        id: checkov_sarif
        if: always()
        run: |
          if [ -f checkov.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Checkov SARIF
        if: always() && steps.checkov_sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: checkov.sarif
          category: checkov

  # SonarCloud (DESC_BACK 12). Se activa al configurar SONAR_TOKEN y las variables SONAR_ORGANIZATION / SONAR_PROJECT_KEY.
  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN}" ] || [ -z "${SONAR_ORGANIZATION}" ] || [ -z "${SONAR_PROJECT_KEY}" ]; then
            echo "::notice::SonarCloud no configurado (falta SONAR_TOKEN, SONAR_ORGANIZATION o SONAR_PROJECT_KEY); se omite."
            exit 0
          fi
          dotnet tool install --global dotnet-sonarscanner --version 9.0.2
          dotnet sonarscanner begin /k:"${SONAR_PROJECT_KEY}" /o:"${SONAR_ORGANIZATION}" \
            /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.qualitygate.wait=true /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          dotnet build Pactogg.sln --configuration Release
          dotnet test Pactogg.sln --configuration Release --no-build --collect:"XPlat Code Coverage;Format=opencover"
          dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"


  terraform:
    name: terraform-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deploy/terraform

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

  # Compuerta de calidad: un solo check obligatorio para proteger main.
  # Pasa solo si pruebas, CodeQL, Semgrep, SonarCloud, dependencias/SBOM, Gitleaks, Checkov y Terraform pasaron.
  quality-gate:
    name: quality-gate
    needs: [build-test, sast, semgrep, sca, secrets, iac, sonarcloud, terraform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          failed = [name for name, job in needs.items() if job["result"] != "success"]
          for name, job in needs.items():
              print(name + ": " + job["result"])
          if failed:
              sys.exit("Compuerta cerrada: " + ", ".join(failed))
          print("Compuerta abierta.")
          '

  docker:
    name: docker-build-scan-push
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image
        run: docker build -t "pactogg-api:${GITHUB_SHA}" .

      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work \
            aquasec/trivy:${TRIVY_VERSION} image --severity CRITICAL,HIGH --ignore-unfixed \
            --format sarif --output /work/trivy-image.sarif --exit-code 0 "pactogg-api:${GITHUB_SHA}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:${TRIVY_VERSION} image --severity CRITICAL,HIGH --ignore-unfixed \
            --format table --exit-code 1 "pactogg-api:${GITHUB_SHA}"

      # Buenas prácticas de la imagen (CIS Docker Benchmark). Falla con hallazgos FATAL.
      - name: Dockle image lint
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:${DOCKLE_VERSION} --exit-code 1 --exit-level fatal \
            "pactogg-api:${GITHUB_SHA}"

      - name: Upload image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-image.sarif

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "ECR_REGISTRY=${registry}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "pactogg-api:${GITHUB_SHA}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "pactogg-api:${GITHUB_SHA}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        shell: bash
        run: |
          set -euo pipefail
          docker tag "pactogg-api:${GITHUB_SHA}" "${DOCKERHUB_USERNAME}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "pactogg-api:${GITHUB_SHA}" "${DOCKERHUB_USERNAME}/${ECR_REPOSITORY}:latest"
          docker push "${DOCKERHUB_USERNAME}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "${DOCKERHUB_USERNAME}/${ECR_REPOSITORY}:latest"

  deploy:
    name: deploy-ec2-ssm
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Redeploy both instances via SSM
        shell: bash
        run: |
          set -euo pipefail
          # Las instancias se buscan por etiqueta: si infra.yml recrea la infraestructura, los IDs cambian.
          discovered="$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=pactogg" "Name=tag:Role,Values=api" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          INSTANCE_IDS="${discovered:-${INSTANCE_IDS:-}}"
          : "${INSTANCE_IDS:?No se encontraron instancias de la API}"
          # shellcheck disable=SC2086
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --comment "pactogg redeploy ${GITHUB_SHA}" \
            --instance-ids $INSTANCE_IDS \
            --parameters 'commands=["sudo /opt/pactogg/redeploy.sh"]' \
            --query Command.CommandId --output text)"
          echo "SSM command: ${command_id}"
          for id in $INSTANCE_IDS; do
            status=Pending
            for _ in $(seq 1 60); do
              status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$id" \
                --query Status --output text 2>/dev/null || echo Pending)"
              case "$status" in
                Success) echo "$id: OK"; break ;;
                Failed|Cancelled|TimedOut) echo "$id: $status" >&2; exit 1 ;;
              esac
              sleep 10
            done
            [ "$status" = "Success" ] || { echo "$id: timeout" >&2; exit 1; }
          done

  smoke:
    name: smoke-test
    needs: deploy
    outputs:
      base_url: ${{ steps.health.outputs.base_url }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Health check
        id: health
        shell: bash
        run: |
          set -euo pipefail
          base="${PUBLIC_BASE_URL:-}"
          if [ -z "$base" ]; then
            # Sin dominio propio la URL es <ip-con-guiones>.sslip.io del gateway.
            ip="$(aws ec2 describe-addresses --filters "Name=tag:Name,Values=pactogg-prod-gateway" \
              --query 'Addresses[0].PublicIp' --output text)"
            base="https://${ip//./-}.sslip.io"
          fi
          base="${base%/}"
          echo "base_url=${base}" >> "$GITHUB_OUTPUT"
          echo "Probando ${base}/health"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "${base}/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "La API no respondió al health check." >&2
          exit 1

  # DAST con OWASP ZAP contra el ambiente desplegado, guiado por el contrato OpenAPI (DESC_BACK 12).
  zap-dast:
    name: zap-dast
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ZAP API scan
        env:
          TARGET: ${{ needs.smoke.outputs.base_url }}
        run: |
          set -euo pipefail
          mkdir -p zap && cp api/openapi.yaml zap/openapi.yaml && chmod -R 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" "${ZAP_IMAGE}" zap-api-scan.py \
            -t /zap/wrk/openapi.yaml -f openapi -O "${TARGET}" \
            -r zap-report.html -J zap-report.json -I || status=$?
          # -I: las advertencias no rompen el pipeline; los FAIL sí.
          exit "${status:-0}"

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-report
          path: zap/zap-report.*
          retention-days: 30
