      responses:
        '204': { description: Sin contenido }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Opcional (spec 006-R13) para reenviar un borrador guardado sin conexión. Con la misma clave se devuelve la primera
        respuesta (cabecera Idempotent-Replayed true) en vez de crear un duplicado. Se ignora en multipart (fotos).
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
    EvidenceId:
      name: eid
      in: path
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Obligatoria en acciones críticas (aceptar, votar, resolver). 8–128 caracteres [A-Za-z0-9_-].
        La primera respuesta 2xx se guarda 24 h y se repite (cabecera Idempotent-Replayed: true) si llega la misma clave;
        sin cabecera → 400 IDEMPOTENCY_KEY_REQUIRED; misma clave en proceso → 409; misma clave con otro cuerpo → 422 IDEMPOTENCY_KEY_IN_USE.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
    GroupId:
      name: gid
      in: path
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    CommitmentId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    GroupPathId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    ContractId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    GroupQuery:
      name: group_id
      in: query
      required: false
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    Status:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [open, in_progress, finished, cancelled] }
    Game:
      name: game
      in: query
      required: false
      schema: { type: string, maxLength: 60 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
  responses:
    BadRequest:
      description: JSON inválido o campos desconocidos (INVALID_INPUT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InsufficientPoints:
      description: Saldo de puntos insuficiente para la fianza (INSUFFICIENT_POINTS)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Autenticación requerida o token inválido/revocado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Sin pertenencia o propiedad sobre el recurso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicto de estado o unicidad
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Datos inválidos o contenido rechazado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Límite de solicitudes excedido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Moderación, almacenamiento o IA no disponible (falla cerrada; AI_UNAVAILABLE en CON-08)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Envelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          nullable: true
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details:
          type: object
          nullable: true
    PageMeta:
      type: object
      properties:
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
    RegisterRequest:
      type: object
      required: [email, password, nickname, accept_privacy, privacy_version]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        nickname: { type: string, pattern: '^[A-Za-z0-9_.-]{3,24}$' }
        accept_privacy: { type: boolean }
        privacy_version: { type: string, minLength: 1, maxLength: 32 }
        device_id: { type: string, maxLength: 128, nullable: true }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
        device_id: { type: string, maxLength: 128, nullable: true }
    GoogleAuthRequest:
      type: object
      required: [id_token]
      additionalProperties: false
      properties:
        id_token: { type: string, minLength: 20, maxLength: 4096 }
        nickname: { type: string, pattern: '^[A-Za-z0-9_.-]{3,24}$', description: Obligatorio solo la primera vez }
        accept_privacy: { type: boolean, description: Obligatorio solo la primera vez }
        privacy_version: { type: string, example: '2026-10-01' }
        device_id: { type: string, maxLength: 128 }
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string }
        device_id: { type: string, maxLength: 128, nullable: true }
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token: { type: string, nullable: true }
        all: { type: boolean, default: false }
    Session:
      type: object
      required: [user, access_token, refresh_token, token_type, expires_in]
      properties:
        user: { $ref: '#/components/schemas/User' }
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        nickname: { type: string }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }
    CreateGroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 40 }
        settings: { $ref: '#/components/schemas/GroupSettings' }
    GroupSettings:
      type: object
      additionalProperties: false
      properties:
        jurors: { type: integer, minimum: 1, maximum: 7, default: 3 }
        consensus: { type: number, minimum: 0.5, maximum: 1, default: 0.66 }
        bond_options:
          type: array
          items: { type: integer, minimum: 0 }
    Group:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        owner_id: { type: string }
        invite_code: { type: string, minLength: 6, maxLength: 6 }
        invite_active: { type: boolean }
        member_count: { type: integer }
        settings: { $ref: '#/components/schemas/GroupSettings' }
        my_role: { type: string }
        my_points: { type: integer }
        created_at: { type: string, format: date-time }
    CreateContractRequest:
      type: object
      required: [game, condition, reward, deadline, bond_required]
      additionalProperties: false
      properties:
        group_id: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        game: { type: string, minLength: 1, maxLength: 60 }
        condition: { type: string, minLength: 1, maxLength: 280 }
        reward: { type: string, minLength: 3, maxLength: 80, description: Sin símbolos ni cantidades de dinero }
        deadline: { type: string, format: date-time }
        bond_required: { type: integer, minimum: 0 }
        target_type:
          type: string
          enum: [group, member]
          default: group
          description: member exige target_id de otro miembro del grupo; retarse a sí mismo devuelve 422 INVALID_TARGET.
        target_id: { type: string, nullable: true }
        source: { type: string, enum: [manual, voice], default: manual }
        original_phrase: { type: string, maxLength: 300, nullable: true, description: 'Frase dictada (spec 005-R14); solo con source=voice, con manual → 422' }
    Contract:
      type: object
      properties:
        id: { type: string }
        group_id: { type: string }
        challenger_id: { type: string }
        target_type: { type: string }
        target_id: { type: string, nullable: true }
        game: { type: string }
        condition: { type: string }
        reward: { type: string }
        source: { type: string, enum: [manual, voice] }
        original_phrase: { type: string, nullable: true }
        deadline: { type: string, format: date-time }
        bond_required: { type: integer }
        status: { type: string, enum: [open, in_progress, voting, fulfilled, cheating, expired, cancelled] }
        accepted_by: { type: string, nullable: true }
        accepted_at: { type: string, format: date-time, nullable: true }
        closed_reason: { type: string, nullable: true, description: 'rejected cuando el retado lo rechazó' }
        executor_id: { type: string, nullable: true, description: Quien debe cumplir el reto (se fija al pasar a voting) }
        jurors_count: { type: integer }
        voting_ends_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, nullable: true, enum: [jury, admin] }
        resolved_at: { type: string, format: date-time, nullable: true }
        evidence_count: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        my_points: { type: integer, nullable: true, description: Solo en la respuesta de aceptar; saldo restante en el grupo }
    ContractActionRequest:
      type: object
      additionalProperties: false
      properties:
        version: { type: integer, description: 'Versión que la app vio; si cambió, 409. Opcional.' }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        nickname: { type: string, pattern: '^[A-Za-z0-9_.-]{3,24}$' }
        avatar_id: { type: string, pattern: '^[a-z0-9_-]{1,32}$' }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 16, maxLength: 128 }
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token: { type: string, minLength: 16, maxLength: 128 }
        new_password: { type: string, minLength: 12, maxLength: 128 }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 128 }
        new_password: { type: string, minLength: 12, maxLength: 128 }
        device_id: { type: string, maxLength: 128 }
    ConsentRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: string, maxLength: 32 }
    PublicProfile:
      type: object
      properties:
        id: { type: string }
        nickname: { type: string }
        avatar_id: { type: string }
        stats:
          type: object
          properties:
            completed: { type: integer }
            cheated: { type: integer }
            streak: { type: integer }
            trophies: { type: integer }
            word_index: { type: integer, minimum: 0, maximum: 100 }
        created_at: { type: string, format: date-time }
    UpdateContractRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        game: { type: string, minLength: 1, maxLength: 60 }
        condition: { type: string, minLength: 1, maxLength: 280 }
        reward: { type: string, minLength: 3, maxLength: 80 }
        deadline: { type: string, format: date-time }
        bond_required: { type: integer }
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [fcm_token, platform]
      properties:
        fcm_token: { type: string, minLength: 20, maxLength: 4096 }
        platform: { type: string, enum: [android, ios, web] }
        app_version: { type: string, maxLength: 32 }
    Device:
      type: object
      properties:
        id: { type: string }
        platform: { type: string }
        app_version: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }
    NotificationPreferences:
      type: object
      additionalProperties: false
      properties:
        retos: { type: boolean }
        votos: { type: boolean }
        torneos: { type: boolean }
        compromisos: { type: boolean }
    AuditEvent:
      type: object
      properties:
        id: { type: string }
        action: { type: string, example: contract.created }
        actor_id: { type: string, nullable: true }
        actor_nickname: { type: string, nullable: true }
        entity_type: { type: string }
        entity_id: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true }
        hash: { type: string }
        created_at: { type: string, format: date-time }
    Profile:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        nickname: { type: string }
        avatar_id: { type: string }
        email_verified: { type: boolean }
        stats:
          type: object
          properties:
            completed: { type: integer }
            cheated: { type: integer }
            streak: { type: integer }
            trophies: { type: integer }
            word_index: { type: integer, minimum: 0, maximum: 100 }
        groups_count: { type: integer }
        notification_preferences: { $ref: '#/components/schemas/NotificationPreferences' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NicknameAvailability:
      type: object
      properties:
        nickname: { type: string }
        available: { type: boolean }
    JoinGroupRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9]{6}$' }
    GroupMember:
      type: object
      properties:
        user_id: { type: string }
        nickname: { type: string }
        avatar_id: { type: string }
        role: { type: string, enum: [admin, member] }
        points_balance: { type: integer }
        joined_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CastVoteRequest:
      type: object
      required: [vote]
      additionalProperties: false
      properties:
        vote: { type: string, enum: [legit, cheat] }
        comment: { type: string, maxLength: 140, nullable: true }
    ResolveVotingRequest:
      type: object
      required: [outcome]
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [fulfilled, cheating] }
    CastVoteResponse:
      type: object
      properties:
        contract_id: { type: string }
        vote: { type: string }
        status: { type: string }
        votes_cast: { type: integer }
        jurors_assigned: { type: integer }
        needs_admin: { type: boolean }
    VoteSummary:
      type: object
      properties:
        contract_id: { type: string }
        status: { type: string }
        jurors_assigned: { type: integer }
        votes_cast: { type: integer }
        votes_remaining: { type: integer }
        voting_ends_at: { type: string, format: date-time, nullable: true }
        i_am_juror: { type: boolean }
        i_voted: { type: boolean }
        admin_can_resolve: { type: boolean }
        voting_extended: { type: boolean }
        admin_deadline_at: { type: string, format: date-time, nullable: true }
        legit_votes: { type: integer, nullable: true, description: Solo al cerrar }
        cheat_votes: { type: integer, nullable: true, description: Solo al cerrar }
    RevealedVote:
      type: object
      description: Anónimo (CLARIFICACION #84); no indica qué jurado votó.
      properties:
        vote: { type: string, enum: [legit, cheat] }
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    ContractResult:
      type: object
      properties:
        contract_id: { type: string }
        outcome: { type: string, enum: [fulfilled, cheating] }
        resolved_by: { type: string, enum: [jury, admin] }
        resolved_at: { type: string, format: date-time }
        legit_votes: { type: integer }
        cheat_votes: { type: integer }
        bond_required: { type: integer }
        bond_movement: { type: string, enum: [bond_release_and_reward, bond_forfeit, none] }
        challenger_id: { type: string }
        executor_id: { type: string, nullable: true }
        reward: { type: string }
        votes:
          type: array
          items: { $ref: '#/components/schemas/RevealedVote' }
    PendingVote:
      type: object
      properties:
        contract: { $ref: '#/components/schemas/Contract' }
        voting_ends_at: { type: string, format: date-time, nullable: true }
    PointsMovement:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        amount: { type: integer }
        balance_after: { type: integer }
        ref_type: { type: string }
        ref_id: { type: string }
        created_at: { type: string, format: date-time }
    MyPoints:
      type: object
      properties:
        group_id: { type: string }
        balance: { type: integer }
        movements:
          type: array
          items: { $ref: '#/components/schemas/PointsMovement' }
    RankingEntry:
      type: object
      properties:
        position: { type: integer }
        user_id: { type: string }
        nickname: { type: string }
        avatar_id: { type: string }
        points_balance: { type: integer }
    CommitmentParty:
      type: object
      properties:
        user_id: { type: string }
        nickname: { type: string }
    Commitment:
      type: object
      properties:
        id: { type: string }
        group_id: { type: string }
        contract_id: { type: string }
        debtor: { $ref: '#/components/schemas/CommitmentParty' }
        creditor: { $ref: '#/components/schemas/CommitmentParty' }
        description: { type: string }
        game: { type: string }
        status: { type: string, enum: [pending, completion_requested, completed] }
        requested_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        group_id: { type: string, nullable: true }
        contract_id: { type: string, nullable: true }
        commitment_id: { type: string, nullable: true }
        read: { type: boolean }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ReadAll:
      type: object
      properties:
        updated: { type: integer }
    FameEntry:
      type: object
      properties:
        contract_id: { type: string }
        executor:
          type: object
          nullable: true
          properties:
            user_id: { type: string }
            nickname: { type: string }
            avatar_id: { type: string }
        game: { type: string }
        condition: { type: string }
        reward: { type: string }
        resolved_at: { type: string, format: date-time, nullable: true }
        photos: { type: array, items: { type: string } }
        links: { type: array, items: { type: string } }
    CreateLinkEvidenceRequest:
      type: object
      required: [type, url]
      additionalProperties: false
      properties:
        type: { type: string, enum: [link] }
        url: { type: string, format: uri, minLength: 8, maxLength: 2048 }
    Moderation:
      type: object
      properties:
        status: { type: string, enum: [approved, rejected] }
        labels:
          type: array
          items: { type: string }
        moderated_at: { type: string, format: date-time, nullable: true }
    Evidence:
      type: object
      properties:
        id: { type: string }
        contract_id: { type: string }
        user_id: { type: string }
        type: { type: string, enum: [link, photo] }
        url: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        object_key: { type: string, nullable: true }
        moderation: { $ref: '#/components/schemas/Moderation' }
        saved_in_fame: { type: boolean }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Fecha de borrado de la foto (30 días). Vacía en enlaces y en fotos del Muro de la Fama.
    ShameItem:
      type: object
      properties:
        contract_id: { type: string }
        status: { type: string, enum: [cheating, expired] }
        label: { type: string, description: Texto corto en tono ligero para la tarjeta }
        executor:
          type: object
          nullable: true
          properties:
            user_id: { type: string }
            nickname: { type: string }
            avatar_id: { type: string }
        game: { type: string }
        condition: { type: string }
        closed_at: { type: string, format: date-time, nullable: true }
    Achievement:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [badge, streak, trophy] }
        code: { type: string, enum: [primer_reto, racha_3, racha_5, racha_10, campeon_torneo] }
        name: { type: string }
        description: { type: string }
        source_type: { type: string, enum: [contract, tournament] }
        source_id: { type: string }
        group_id: { type: string, nullable: true }
        earned_at: { type: string, format: date-time }
    CreateTournamentRequest:
      type: object
      required: [game, max_groups, scheduled_at]
      properties:
        game: { type: string, minLength: 1, maxLength: 60 }
        format: { type: string, enum: [single_elimination], default: single_elimination }
        max_groups: { type: integer, enum: [4, 8, 16] }
        entry_points: { type: integer, minimum: 0, maximum: 500, default: 0 }
        scheduled_at: { type: string, format: date-time, description: Fecha futura }
    UpdateTournamentRequest:
      type: object
      properties:
        game: { type: string, minLength: 1, maxLength: 60 }
        scheduled_at: { type: string, format: date-time }
        max_groups: { type: integer, enum: [4, 8, 16] }
    JoinTournamentRequest:
      type: object
      required: [group_id]
      properties:
        group_id: { type: string }
        code: { type: string, minLength: 6, maxLength: 6, description: Obligatorio si la ruta lleva el id del torneo }
    TournamentGroup:
      type: object
      properties:
        group_id: { type: string }
        name: { type: string }
        member_count: { type: integer }
        is_organizer: { type: boolean }
    Tournament:
      type: object
      properties:
        id: { type: string }
        group_id: { type: string, description: Grupo organizador }
        organizer_id: { type: string }
        game: { type: string }
        format: { type: string }
        max_groups: { type: integer, enum: [4, 8, 16] }
        entry_points: { type: integer }
        prize_pool: { type: integer }
        scheduled_at: { type: string, format: date-time }
        participants:
          type: array
          items: { type: string }
        groups:
          type: array
          description: Solo en detalle, crear, editar, inscribir, iniciar y cancelar
          items: { $ref: '#/components/schemas/TournamentGroup' }
        status: { type: string, enum: [open, in_progress, finished, cancelled] }
        winner_group_id: { type: string, nullable: true }
        code: { type: string, description: Solo para el organizador y administradores inscritos mientras está abierto }
        started_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cancel_reason: { type: string, enum: [by_organizer, not_enough_groups], nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        bracket: { $ref: '#/components/schemas/Bracket' }
    Bracket:
      type: object
      properties:
        size: { type: integer, description: Lugares del bracket (2, 4, 8 o 16); 0 antes de iniciar }
        rounds: { type: integer }
        matches:
          type: array
          items: { $ref: '#/components/schemas/Match' }
    Match:
      type: object
      properties:
        id: { type: string }
        tournament_id: { type: string }
        round: { type: integer }
        position: { type: integer }
        p1_group_id: { type: string, nullable: true }
        p2_group_id: { type: string, nullable: true }
        p1_score: { type: integer, nullable: true }
        p2_score: { type: integer, nullable: true }
        winner_group_id: { type: string, nullable: true }
        status: { type: string, enum: [pending, reported, confirmed, disputed, bye, cancelled] }
        next_match_id: { type: string, nullable: true }
        reported_at: { type: string, format: date-time, nullable: true }
        reported_by_group_id: { type: string, nullable: true }
        dispute_reason: { type: string, nullable: true }
        resolution: { type: string, nullable: true, enum: [confirmed_by_rival, resolved_dispute, resolved_no_answer, abandonment] }
        confirmed_at: { type: string, format: date-time, nullable: true }
        screenshot_url: { type: string, nullable: true, description: URL firmada 15 min de la foto (MAT-02..06) }
        updated_at: { type: string, format: date-time }
    DisputeMatchRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 140 }
    ResolveMatchRequest:
      type: object
      required: [winner_group_id]
      properties:
        winner_group_id: { type: string }
        reason: { type: string, maxLength: 140 }
    InviteGroupsRequest:
      type: object
      required: [group_ids]
      properties:
        group_ids:
          type: array
          minItems: 1
          maxItems: 16
          items: { type: string }
    InviteGroupsResponse:
      type: object
      properties:
        invited: { type: array, items: { type: string } }
        skipped:
          type: array
          items:
            type: object
            properties:
              group_id: { type: string }
              reason: { type: string, enum: [not_member, already_joined, not_found] }
        code: { type: string }
    ContractDraft:
      type: object
      properties:
        target_type: { type: string, enum: [group, member] }
        target_id: { type: string, nullable: true }
        target_nickname: { type: string, nullable: true }
        game: { type: string }
        condition: { type: string }
        reward: { type: string }
        missing_fields: { type: array, items: { type: string, enum: [game, condition, reward] } }
        rival_unmatched: { type: boolean }
        members:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id: { type: string }
              nickname: { type: string }
        cached: { type: boolean }
    NextMatch:
      type: object
      properties:
        match: { $ref: '#/components/schemas/Match' }
        my_group_id: { type: string }
        opponent_group_id: { type: string, nullable: true }
        game: { type: string }
        scheduled_at: { type: string, format: date-time }
