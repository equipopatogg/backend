        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Evidence]
      operationId: createEvidence
      summary: Agregar evidencia por enlace o foto
      description: >-
        La primera evidencia aprobada pasa el contrato a voting (CLARIFICACION #30).
        Se admiten hasta 3 evidencias por contrato (#60); la cuarta devuelve 409 EVIDENCE_LIMIT_REACHED.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLinkEvidenceRequest' }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                type:
                  type: string
                  enum: [photo]
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Evidencia moderada y almacenada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Evidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/contracts/{id}/evidence/{eid}:
    put:
      tags: [Evidence]
      operationId: replaceEvidence
      summary: Reemplazar evidencia antes del primer voto (EVI-04)
      description: >-
        Solo el autor y solo mientras el reto no tenga votos (spec 007-R7). Mismo cuerpo y reglas que EVI-02;
        la foto anterior se borra de S3. Con votos responde 409 VOTING_STARTED.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/EvidenceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLinkEvidenceRequest' }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                type:
                  type: string
                  enum: [photo]
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Evidencia reemplazada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Evidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/evidence/{eid}:
    delete:
      tags: [Evidence]
      operationId: deleteEvidence
      summary: Borrar evidencia propia antes del primer voto (EVI-05)
      description: >-
        Solo el autor y antes del primer voto (spec 007-R8). Se borra de S3. Si era la única evidencia el reto
        vuelve a in_progress y se liberan los jurados (007-D2). Después del primer voto, 409 VOTING_STARTED:
        el administrador del grupo la quita con REP-04.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '204': { description: Sin contenido }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/evidence/{eid}/save-fame:
    post:
      tags: [Evidence]
      operationId: saveEvidenceInFame
      summary: Guardar foto en el Muro de la Fama (EVI-06)
      description: >-
        Cualquier miembro del grupo, solo fotos aprobadas de retos cumplidos (spec 007-R9). La foto deja de borrarse
        a los 30 días (expires_at queda vacío). Idempotente. Reto no cumplido → 409; enlace → 422.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Foto guardada en la Fama
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Evidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/groups/{gid}/shame:
    get:
      tags: [Achievements]
      operationId: groupShameWall
      summary: Muro de la Vergüenza (ACH-02)
      description: >-
        Retos del grupo que terminaron en cheating o expired, más nuevos primero (spec 008-R9).
        Tono ligero, sin fotos ni comentarios. Caché 60 s.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Retos del muro
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ShameItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/users/{id}/achievements:
    get:
      tags: [Achievements]
      operationId: userAchievements
      summary: Logros de una persona (ACH-04)
      description: >-
        Catálogo v1 (spec 008-D1) con primer_reto, racha_3, racha_5, racha_10 y campeon_torneo. Solo para quien comparte un grupo
        con la persona (o ella misma); si no, 404. Caché 60 s.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Logros, más recientes primero
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Achievement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
