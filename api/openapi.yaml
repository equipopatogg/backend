openapi: 3.0.3
info:
  title: PactoGG API
  version: 1.0.0
  description: Contrato de los endpoints obligatorios de la evaluación más perfil, unirse a grupos, miembros, tablero de retos y aceptar/rechazar (v0.5.0) y jurado, puntos, compromisos, avisos y Muro de la Fama (v0.6.0); login con Google (v0.6.1); reglas de votación, plazos, idempotencia y límites de los documentos (v0.7.0); verificación de correo, recuperación y cambio de contraseña, perfil público, editar/cancelar retos, auditoría y push con FCM (v0.8.0); validación SDD 001–006 con nombre de grupo y juego moderados, login sin pista por tiempo, /health/ready y tope de 5 dispositivos (v0.8.1); administración de grupos, borrar cuenta, reportes, bloqueos y detalles (v0.9.0); evidencias, reputación y torneos parte 1 (v0.10–v0.11); partidas MAT-03..06, premio, TOR-09 y contrato por voz CON-08 con adaptador de IA (v0.12.0).
servers:
  - url: https://52-3-200-211.sslip.io
    description: Producción AWS (HTTPS, Let's Encrypt; cambia si se recrea la infraestructura)
  - url: http://localhost:5080
    description: Desarrollo local
tags:
  - name: Auth
  - name: Users
  - name: Groups
  - name: Contracts
  - name: Evidence
  - name: Tournaments
  - name: Matches
  - name: Votes
  - name: Points
  - name: Commitments
  - name: Notifications
  - name: Fame
  - name: Devices
  - name: Audit
  - name: Achievements
paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Vida del proceso (la usa Caddy para balancear)
      security: []
      responses:
        '200': { description: Healthy }
  /health/ready:
    get:
      tags: [Health]
      operationId: healthReady
      summary: Lista para atender, incluida la base de datos (CLARIFICACION #136, F2-D54)
      security: []
      responses:
        '200': { description: Healthy }
        '503': { description: Unhealthy; la base de datos no responde }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Registrar cuenta
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Session' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Iniciar sesión
      description: >-
        AUTH-01. Respuesta genérica 401 INVALID_CREDENTIALS. Con un correo inexistente también se verifica un hash
        Argon2id para que el tiempo de respuesta no revele qué cuentas existen (Q-020).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/google:
    post:
      tags: [Auth]
      operationId: googleAuth
      summary: Entrar o registrarse con Google (AUTH-02 · ID 12)
      description: >-
        La app obtiene el ID token con Credential Manager / Google Sign-In (Client ID web del backend) y lo envía aquí.
        El backend valida firma, emisor, audiencia y vigencia con las llaves públicas de Google.
        Cuenta existente (por Google o por el mismo correo verificado) → 200 y se vincula.
        Cuenta nueva → exige nickname, accept_privacy y privacy_version vigentes; sin nickname responde
        422 NICKNAME_REQUIRED con details.email y details.suggested_name para mostrar la pantalla de apodo. Creada → 201.
        Si el backend no tiene Client IDs configurados → 503 GOOGLE_AUTH_UNAVAILABLE (falla cerrada).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleAuthRequest' }
      responses:
        '200':
          description: Sesión de cuenta existente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Session' }
        '201':
          description: Cuenta creada con Google
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      summary: Renovar la sesión (AUTH-03)
      description: >-
        Entrega un access token nuevo y ROTA el refresh token (el anterior queda revocado).
        La app lo llama en silencio antes de que venza el access token (15 min) para mantener la sesión viva.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Sesión renovada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Cerrar sesión individual o global
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verificar el correo con el token del enlace (AUTH-05)
      description: >-
        El token llega por correo (deep link pactogg://auth/verify-email?token=... o código para pegar). Es de un solo uso y caduca en 24 h.
        Verificar es obligatorio para crear o unirse a grupos y para ser jurado (CLARIFICACION #5) cuando Auth:RequireVerifiedEmail está activo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Correo verificado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: object, properties: { email_verified: { type: boolean } } }
        '400': { description: 'INVALID_OR_EXPIRED_TOKEN', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/verify-email/resend:
    post:
      tags: [Auth]
      operationId: resendVerificationEmail
      summary: Reenviar el correo de verificación (AUTH-05)
      description: Máximo 3 por hora por usuario. 409 EMAIL_ALREADY_VERIFIED si ya está verificado.
      security:
        - BearerAuth: []
      responses:
        '202': { description: Correo en camino }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Pedir el enlace para restablecer la contraseña (AUTH-06)
      description: >-
        Siempre responde 202 exista o no la cuenta (evita enumerar correos). Máximo 3 correos por hora por cuenta.
        El enlace (pactogg://auth/reset-password?token=...) sirve una vez y caduca en 1 hora (CLARIFICACION #11).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202': { description: 'Si la cuenta existe, se envió el correo' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Cambiar la contraseña con el token del correo (AUTH-07)
      description: Revoca todas las sesiones y marca el correo como verificado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Contraseña cambiada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: object, properties: { password_reset: { type: boolean } } }
        '400': { description: 'INVALID_OR_EXPIRED_TOKEN', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getMyProfile
      summary: Perfil propio con estadísticas (USR-02)
      description: Caché de 60 s por usuario; se invalida al editar el perfil, crear o unirse a un grupo.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      operationId: updateMyProfile
      summary: Cambiar apodo y/o avatar (USR-03)
      description: >-
        El apodo es único (sin distinguir mayúsculas) y pasa por moderación de texto antes de guardarse
        (falla cerrada: si la moderación no responde, 503). Al menos un campo es obligatorio.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Users]
      operationId: deleteAccount
      summary: Eliminar cuenta (USR-04), borra y anonimiza de inmediato
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                password: { type: string, maxLength: 128 }
                confirm: { type: string, enum: [ELIMINAR] }
      responses:
        '204': { description: Sin contenido }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/users/check-nickname:
    get:
      tags: [Users]
      operationId: checkNickname
      summary: ¿El apodo está libre? (USR-06, público)
      description: Sin autenticación ni caché. Límite estricto de 20 consultas por minuto por IP.
      security: []
      parameters:
        - name: nickname
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_.-]{3,24}$' }
      responses:
        '200':
          description: Disponibilidad
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NicknameAvailability' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/users/{id}:
    get:
      tags: [Users]
      operationId: getPublicProfile
      summary: Perfil público de alguien de tus grupos (USR-05)
      description: Apodo, avatar, estadísticas e Índice de Palabra; nunca el correo (CLARIFICACION #14). 403 NO_SHARED_GROUP si no comparten grupo.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200':
          description: Perfil público
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/users/me/password:
    post:
      tags: [Users]
      operationId: changePassword
      summary: Cambiar la contraseña con la actual
      description: >-
        Revoca todas las sesiones y devuelve una sesión nueva para este dispositivo (guarda los tokens nuevos).
        422 INVALID_CREDENTIALS si la actual no coincide; 409 PASSWORD_NOT_SET en cuentas creadas con Google.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Sesión nueva
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/users/me/consent:
    post:
      tags: [Users]
      operationId: acceptConsent
      summary: Aceptar la versión vigente del aviso de privacidad (USR-07)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequest' }
      responses:
        '200':
          description: Aceptación registrada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: object, properties: { version: { type: string }, accepted_at: { type: string, format: date-time } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/groups:
    get:
      tags: [Groups]
      operationId: listMyGroups
      summary: Mis grupos (GRP-02)
      description: Grupos activos del usuario, del más reciente al más antiguo, con my_role y my_points. Caché 60 s.
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Texto contenido en el nombre (sin distinguir mayúsculas).
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Group' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Crear grupo
      description: >-
        GRP-01. Nombre de 2 a 40 caracteres (Q-019). El nombre pasa por moderación de texto antes de guardarse;
        si se rechaza responde 422 CONTENT_REJECTED y si el moderador no responde, 503 (falla cerrada, Q-021).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '201':
          description: Grupo creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/groups/join:
    post:
      tags: [Groups]
      operationId: joinGroup
      summary: Unirse con código de invitación (MEM-01)
      description: >-
        El código no distingue mayúsculas. Entra como member con 100 puntos.
        409 ALREADY_MEMBER, GROUP_LIMIT_REACHED (5 grupos por usuario) o GROUP_FULL (20 miembros).
        Límite de 10 intentos cada 10 minutos por usuario.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinGroupRequest' }
      responses:
        '200':
          description: Ya eres miembro
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/groups/{id}:
    get:
      tags: [Groups]
      operationId: getGroup
      summary: Detalle del grupo con su configuración (GRP-03)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupPathId'
      responses:
        '200':
          description: Grupo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Groups]
      operationId: updateGroup
      summary: Editar nombre y reglas (GRP-04, admin)
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 40 }
                settings: { $ref: '#/components/schemas/GroupSettings' }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Eliminar grupo (GRP-05, solo el creador)
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Sin contenido }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/groups/{id}/members:
    get:
      tags: [Groups]
      operationId: listGroupMembers
      summary: Miembros del grupo con rol y saldo (MEM-02)
      description: Orden de ingreso. q = prefijo del apodo (autocompletar rival). Caché 60 s.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupPathId'
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 24 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/GroupMember' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/contracts:
    post:
      tags: [Contracts]
      operationId: createContract
      summary: Crear contrato en un grupo
      description: El grupo necesita al menos 3 miembros (CLARIFICACION #22 y #75); si no, 409 GROUP_TOO_SMALL.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContractRequest' }
      responses:
        '201':
          description: Contrato creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/groups/{gid}/contracts:
    get:
      tags: [Contracts]
      operationId: listGroupContracts
      summary: Tablero de retos del grupo (CON-02)
      description: Del más reciente al más antiguo. Caché 30 s que se invalida al crear, aceptar, rechazar o subir evidencia.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, in_progress, voting, fulfilled, cheating, expired, cancelled] }
        - name: mine
          in: query
          required: false
          description: true = solo retos donde soy retador, retado o quien aceptó.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Game'
        - name: q
          in: query
          required: false
          description: Texto en condición, recompensa o juego.
          schema: { type: string, maxLength: 60 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Contract' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Contracts]
      operationId: createGroupContract
      summary: Crear contrato usando el grupo de la ruta
      description: El grupo necesita al menos 3 miembros (CLARIFICACION #22 y #75); si no, 409 GROUP_TOO_SMALL.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContractRequest' }
      responses:
        '201':
          description: Contrato creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/contracts/{id}:
    get:
      tags: [Contracts]
      operationId: getContract
      summary: Detalle de un reto (CON-03)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Reto
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Contracts]
      operationId: updateContract
      summary: Editar un reto que nadie ha aceptado (CON-04)
      description: Solo quien lo publicó (403 NOT_CONTRACT_OWNER), solo en open y con la version que vio la app (409 si cambió). Campos omitidos no cambian.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContractRequest' }
      responses:
        '200':
          description: Reto actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Contracts]
      operationId: cancelContract
      summary: Cancelar un reto que nadie ha aceptado (CON-05)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - name: version
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Reto cancelado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/groups/{gid}/contracts/parse:
    post:
      tags: [Contracts]
      operationId: parseContractPhrase
      summary: Borrador del reto a partir de la frase dictada (CON-08)
      description: >-
        Spec 005. La app transcribe la voz y manda solo el texto (1 a 300 caracteres); no se envía audio ni se guarda nada.
        El modelo recibe la frase delimitada y los apodos del grupo (sin correos ni ids). Su salida se valida contra un esquema
        estricto; si falla dos veces → 422 AI_PARSE_FAILED. El rival solo se acepta si coincide con el apodo de otro miembro;
        si no, rival_unmatched=true y members para elegir. Campos que no cumplen CON-01 (o recompensa con dinero) vuelven vacíos
        en missing_fields. Límite 5 por minuto y 20 por día (429 con Retry-After); caché 10 min por hash de la frase (cached=true).
        Sin proveedor configurado, más de 8 s o circuito abierto → 503 AI_UNAVAILABLE: la app ofrece escribir a mano.
        Después se lanza con CON-01 usando source=voice y original_phrase.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phrase]
              properties:
                phrase: { type: string, minLength: 1, maxLength: 300 }
      responses:
        '200':
          description: Borrador para revisar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContractDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/contracts/{id}/cancel:
    post:
      tags: [Contracts]
      operationId: cancelContractByAdmin
      summary: Cancelación por un administrador del grupo (CON-09)
      description: >-
        Spec 004-R16 (Q-022). Un administrador cancela un reto en open o in_progress, por ejemplo uno imposible,
        con un motivo de 5 a 140 caracteres que pasa por moderación. La fianza vuelve completa a quien aceptó
        (bond_release), no cambian rachas ni Índice de Palabra y se avisa al retador y a quien aceptó (contract_cancelled).
        Miembro sin rol admin → 403 NOT_GROUP_ADMIN; administrador que aceptó el reto → 409 ADMIN_IS_PARTICIPANT;
        en voting o estado final → 409.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 140 }
      responses:
        '200':
          description: Reto cancelado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/contracts/{id}/accept:
    post:
      tags: [Contracts]
      operationId: acceptContract
      summary: Aceptar un reto y retener la fianza (CON-06)
      description: >-
        Lo acepta el retado (target_type member) o cualquier miembro distinto del retador (target_type group).
        En una transacción: open → in_progress, se descuenta bond_required del saldo del grupo (nunca negativo)
        y se registra bond_lock en el libro de puntos. Responde el reto con my_points (saldo restante).
        402 INSUFFICIENT_POINTS; 403 NOT_CONTRACT_TARGET; 409 CANNOT_ACCEPT_OWN_CONTRACT o INVALID_CONTRACT_STATE
        (ya no está open, venció o cambió de versión).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractActionRequest' }
      responses:
        '200':
          description: Reto aceptado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/InsufficientPoints' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/contracts/{id}/reject:
    post:
      tags: [Contracts]
      operationId: rejectContract
      summary: Rechazar un reto dirigido a mí (CON-07)
      description: Solo el retado de un reto member en estado open. Pasa a cancelled con closed_reason = rejected; no mueve puntos.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractActionRequest' }
      responses:
        '200':
          description: Reto rechazado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/contracts/{id}/evidence:
    get:
      tags: [Evidence]
      operationId: listEvidence
      summary: Evidencias del reto (EVI-03)
      description: >-
        Solo miembros del grupo (jurados incluidos). Fotos con URL del CDN; enlaces con su URL original.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Evidencias aprobadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
