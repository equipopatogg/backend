        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/groups/{gid}/tournaments:
    get:
      tags: [Tournaments]
      operationId: listGroupTournaments
      summary: Listar torneos de un grupo
      security:
        - BearerAuth: []
