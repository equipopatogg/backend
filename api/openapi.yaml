        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Game'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Tournament' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Tournaments]
      operationId: createTournament
      summary: Crear torneo entre grupos (TOR-01)
      description: >-
        Solo un administrador del grupo (spec 010-R1). Su grupo queda inscrito y él paga la inscripción de su saldo en ese grupo
        (010-D1). Un torneo abierto o en curso por grupo organizador; si ya hay uno, 409 TOURNAMENT_ALREADY_ACTIVE. Sin saldo, 402.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTournamentRequest' }
      responses:
        '201':
          description: Torneo creado en open, con su código
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/InsufficientPoints' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tournaments/{id}:
    get:
      tags: [Tournaments]
      operationId: getTournament
      summary: Detalle del torneo (TOR-03)
      description: >-
        Grupos inscritos (nombre y número de miembros, sin datos personales), bolsa, estado y bracket (spec 010-R2).
        Con el id solo lo ven los miembros de grupos inscritos; con el código de 6 caracteres cualquier persona con sesión ve
        una vista previa para decidir si inscribe a su grupo (F2-D67). El campo code solo llega al organizador y a los
        administradores de grupos inscritos mientras el torneo está abierto.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del torneo (24 hex) o, donde se indica, el código de 6 caracteres.
          schema: { type: string }
      responses:
        '200':
          description: Torneo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tournaments]
      operationId: updateTournament
      summary: Editar torneo abierto (TOR-04)
      description: Solo el organizador y solo en open (010-R3). max_groups nunca menor que los inscritos. La inscripción no se cambia.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del torneo (24 hex) o, donde se indica, el código de 6 caracteres.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTournamentRequest' }
      responses:
        '200':
          description: Torneo actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tournaments/{id}/cancel:
    post:
      tags: [Tournaments]
      operationId: cancelTournament
      summary: Cancelar torneo (TOR-05)
      description: >-
        Solo el organizador, en open o in_progress (010-R4). Devuelve todas las inscripciones con movimientos
        tournament_entry positivos (F2-D66), cancela las partidas abiertas y avisa a los grupos (tournament_cancelled).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del torneo (24 hex) o, donde se indica, el código de 6 caracteres.
          schema: { type: string }
      responses:
        '200':
          description: Torneo cancelado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/tournaments/{id}/join:
    post:
      tags: [Tournaments]
      operationId: joinTournament
      summary: Inscribir a mi grupo (TOR-06)
      description: >-
        Un administrador del grupo lo inscribe y paga la inscripción de su saldo en ese grupo (010-R5, 010-D2).
        La ruta acepta el id (entonces code es obligatorio en el cuerpo) o directamente el código. Código incorrecto → 404.
        Sin saldo 402; ya inscrito 409 ALREADY_IN_TOURNAMENT; lleno 409 TOURNAMENT_FULL; no abierto 409 TOURNAMENT_NOT_OPEN.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del torneo (24 hex) o, donde se indica, el código de 6 caracteres.
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinTournamentRequest' }
      responses:
        '200':
          description: Grupo inscrito
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/InsufficientPoints' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Tournaments]
      operationId: leaveTournament
      summary: Sacar a mi grupo del torneo (TOR-07)
      description: >-
        Un administrador del grupo, solo en open (010-R6). Se devuelve la inscripción a quien la pagó. El grupo organizador
        no puede salir (409 ORGANIZER_GROUP_CANNOT_LEAVE); el organizador cancela el torneo.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del torneo (24 hex) o, donde se indica, el código de 6 caracteres.
          schema: { type: string }
        - { name: group_id, in: query, required: true, schema: { type: string } }
      responses:
        '204': { description: Sin contenido }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/tournaments/{id}/invite:
    post:
      tags: [Tournaments]
      operationId: inviteGroupsToTournament
      summary: Invitar grupos (TOR-09)
      description: >-
        Spec 010-R8 y 010-D3. Solo el organizador y con el torneo open. Se avisa (tournament_invite, con el código) a los
        administradores de los grupos donde el organizador también es miembro activo; los demás se saltan con not_member
        y el código se comparte fuera de la app. already_joined = ya inscrito; not_found = id inválido o grupo eliminado.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteGroupsRequest' }
      responses:
        '200':
          description: Resultado de la invitación
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InviteGroupsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tournaments/{id}/start:
    post:
      tags: [Tournaments]
      operationId: startTournament
      summary: Iniciar torneo y generar el bracket (TOR-08)
      description: >-
        Solo el organizador, con al menos 2 grupos (si no, 409 NOT_ENOUGH_GROUPS). Cierra inscripciones, sortea el orden,
        completa con byes hasta 2, 4, 8 o 16 lugares (los byes avanzan solos) y crea todas las partidas (010-R7).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del torneo (24 hex) o, donde se indica, el código de 6 caracteres.
          schema: { type: string }
      responses:
        '200':
          description: Torneo en curso con su bracket
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/tournaments/{id}/bracket:
    get:
      tags: [Matches]
      operationId: getTournamentBracket
      summary: Bracket completo (MAT-01)
      description: Rondas y partidas para los miembros de grupos inscritos (010-R9). Caché 10 s.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id del torneo (24 hex) o, donde se indica, el código de 6 caracteres.
          schema: { type: string }
      responses:
        '200':
          description: Bracket
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Bracket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/matches/{id}:
    get:
      tags: [Matches]
      operationId: getMatch
      summary: Detalle de una partida (MAT-02)
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Partida
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Match' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/matches/{id}/report:
    post:
      tags: [Matches]
      operationId: reportMatch
      summary: Reportar resultado con foto (MAT-03)
      description: >-
        Spec 010-R10. Un miembro activo de uno de los dos grupos manda marcador y foto (JPEG, PNG o WebP, máx. 5 MB, moderada).
        Queda como representante de su grupo (010-D4). Empate → 422 TIE_NOT_ALLOWED (se repite la partida). Si eres de los dos
        grupos, group_id dice por cuál juegas. winner_group_id es opcional y debe coincidir con el marcador. La foto se guarda bajo
        evidence/ y se borra a los 30 días. Se avisa al grupo rival (tournament_match_reported). Partida ya reportada, sin rival
        o torneo que no está en curso → 409.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, p1_score, p2_score]
              properties:
                file: { type: string, format: binary }
                p1_score: { type: integer, minimum: 0, maximum: 999 }
                p2_score: { type: integer, minimum: 0, maximum: 999 }
                winner_group_id: { type: string }
                group_id: { type: string, description: Solo si eres miembro de los dos grupos }
      responses:
        '200':
          description: Partida reportada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Match' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/matches/{id}/confirm:
    post:
      tags: [Matches]
      operationId: confirmMatch
      summary: El grupo rival confirma el resultado (MAT-04)
      description: >-
        Spec 010-R11. Solo un miembro del grupo que no reportó (403 NOT_MATCH_PLAYER; quien reportó → 403 CANNOT_CONFIRM_OWN_REPORT).
        La partida pasa a confirmed, el ganador avanza a su lugar en la siguiente partida y, si era la final, el torneo termina:
        la bolsa se reparte en partes iguales entre quienes jugaron por el campeón (residuo al primero, tournament_prize),
        trofeo campeon_torneo y aviso tournament_finished (010-R14).
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Partida confirmada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Match' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/matches/{id}/dispute:
    post:
      tags: [Matches]
      operationId: disputeMatch
      summary: El grupo rival disputa el resultado (MAT-05)
      description: Spec 010-R12. Motivo de 5 a 140 caracteres, moderado. La partida pasa a disputed y se avisa al organizador (tournament_match_disputed).
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisputeMatchRequest' }
      responses:
        '200':
          description: Partida en disputa
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Match' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/matches/{id}/resolve:
    post:
      tags: [Matches]
      operationId: resolveMatch
      summary: El organizador fija el ganador (MAT-06)
      description: >-
        Spec 010-R13. Solo el organizador (403 NOT_TOURNAMENT_ORGANIZER) y nunca en una partida donde juega uno de sus grupos
        (409 ORGANIZER_PLAYS_MATCH, CLARIFICACION #105). Se puede en disputed (resolved_dispute), en reported con 24 h o más
        sin respuesta (resolved_no_answer; antes → 409 REPORT_TOO_RECENT) o en pending con los dos grupos (abandonment).
        Si el ganador contradice el reporte, o es abandono, el marcador se borra. Avanza al ganador igual que MAT-04.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveMatchRequest' }
      responses:
        '200':
          description: Partida resuelta
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Match' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/matches/next:
    get:
      tags: [Matches]
      operationId: getMyNextMatch
      summary: Mi siguiente partida (MAT-07)
      description: >-
        La partida pendiente con los dos grupos definidos de la ronda más baja en la que juega alguno de mis grupos (010-R15).
        Si no hay, responde {"data":null}.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Siguiente partida o null
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/NextMatch'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/votes/pending:
    get:
      tags: [Votes]
      operationId: listPendingVotes
      summary: Retos que me toca votar (VOT-01)
      description: >-
        Retos en voting donde soy jurado y aún no voto, del más reciente al más antiguo.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PendingVote' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/contracts/{id}/votes:
    put:
      tags: [Votes]
      operationId: castVote
      summary: Emitir voto de jurado (VOT-02)
      description: >-
        Un voto por jurado, inmutable (legit o cheat, comentario opcional ≤140 moderado). Consenso (CLARIFICACION #79–83): votos_del_lado × 100 ≥ consenso × votos emitidos, con quórum de la mitad de los jurados asignados; se cierra antes solo si el resultado ya no puede cambiar. fulfilled libera la fianza, paga un premio igual (reward) y crea el compromiso; cheating pasa la fianza al retador. Empate: decide un administrador que no sea parte (needs_admin = true) o, si no hay, se asigna un jurado adicional una sola vez. A las 48 h sin quórum se extiende 24 h una vez; luego decide el administrador en 48 h o el reto se cancela con devolución. Fuera de plazo → 409 VOTING_CLOSED.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CastVoteRequest' }
      responses:
        '200':
          description: Voto registrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CastVoteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/contracts/{id}/votes/summary:
    get:
      tags: [Votes]
      operationId: getVoteSummary
      summary: Avance de la votación (VOT-03)
      description: >-
        Cuántos votaron y cuántos faltan; el sentido de los votos solo se muestra al cerrar.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Resumen
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/VoteSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/contracts/{id}/votes/resolve:
    post:
      tags: [Votes]
      operationId: resolveVoting
      summary: El administrador decide (VOT-04)
      description: >-
        Solo un admin del grupo que no sea parte del reto (403 ADMIN_IS_PARTY) y solo durante la fase del administrador (empate, sin quórum tras la extensión o sin jurados); si no, 409 VOTING_NOT_FINISHED. Si no decide en 48 h, el reto queda cancelled y se devuelve la fianza.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveVotingRequest' }
      responses:
        '200':
          description: Reto resuelto
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContractResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/contracts/{id}/result:
    get:
      tags: [Votes]
      operationId: getContractResult
      summary: Resultado final (VOT-05)
      description: >-
        Con los votos revelados. 409 si la votación sigue abierta.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContractResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/groups/{gid}/points/me:
    get:
      tags: [Points]
      operationId: getMyPoints
      summary: Mi saldo y movimientos (PTS-01)
      description: >-
        Los puntos no tienen valor monetario y no se pueden comprar.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [bond_lock, bond_release, bond_forfeit, reward, tournament_entry, tournament_prize, adjustment] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Saldo y movimientos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MyPoints' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/groups/{gid}/points/ranking:
    get:
      tags: [Points]
      operationId: getPointsRanking
      summary: Ranking del grupo por puntos (PTS-02)
      description: >-
        Caché 60 s.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ranking
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RankingEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/groups/{gid}/commitments:
    get:
      tags: [Commitments]
      operationId: listCommitments
      summary: Compromisos Debo / Me deben (COM-01)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [debo, me-deben], default: debo }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, completion_requested, completed] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Commitment' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/commitments/{id}/complete:
    post:
      tags: [Commitments]
      operationId: completeCommitment
      summary: El acreedor lo marca como cumplido (COM-03)
      description: >-
        Desde pending o completion_requested. 403 NOT_COMMITMENT_PARTY; 409 INVALID_COMMITMENT_STATE.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CommitmentId'
      responses:
        '200':
          description: Compromiso cumplido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Commitment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/commitments/{id}/request-complete:
    post:
      tags: [Commitments]
      operationId: requestCommitmentCompletion
      summary: El deudor pide confirmación (COM-04)
      description: >-
        Solo desde pending; avisa al acreedor.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CommitmentId'
      responses:
        '200':
          description: Solicitud registrada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Commitment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Mis avisos (NOT-01)
      description: >-
        Del más reciente al más antiguo; meta incluye unread_count. Tipos: contract_received, contract_accepted, vote_requested, vote_tie, contract_resolved, commitment_completion_requested, commitment_completed.
      security:
        - BearerAuth: []
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
                      meta: 
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              unread_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/notifications/{id}:
    delete:
      tags: [Notifications]
      operationId: deleteNotification
      summary: Eliminar un aviso (NOT-04)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '204': { description: Aviso eliminado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/notifications/{id}/read:
