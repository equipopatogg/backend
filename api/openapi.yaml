openapi: 3.0.3
info:
  title: PactoGG API
  version: 1.0.0
  description: Contrato de los endpoints obligatorios de la evaluación más perfil, unirse a grupos, miembros, tablero de retos y aceptar/rechazar (v0.5.0) y jurado, puntos, compromisos, avisos y Muro de la Fama (v0.6.0); login con Google (v0.6.1).
servers:
  - url: https://52-3-200-211.sslip.io
    description: Producción AWS (HTTPS, Let's Encrypt; cambia si se recrea la infraestructura)
  - url: http://localhost:5080
    description: Desarrollo local
tags:
  - name: Auth
  - name: Users
  - name: Groups
  - name: Contracts
  - name: Evidence
  - name: Tournaments
  - name: Votes
  - name: Points
  - name: Commitments
  - name: Notifications
  - name: Fame
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Registrar cuenta
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Session' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/google:
    post:
      tags: [Auth]
      operationId: googleAuth
      summary: Entrar o registrarse con Google (AUTH-02 · ID 12)
      description: >-
        La app obtiene el ID token con Credential Manager / Google Sign-In (Client ID web del backend) y lo envía aquí.
        El backend valida firma, emisor, audiencia y vigencia con las llaves públicas de Google.
        Cuenta existente (por Google o por el mismo correo verificado) → 200 y se vincula.
        Cuenta nueva → exige nickname, accept_privacy y privacy_version vigentes; sin nickname responde
        422 NICKNAME_REQUIRED con details.email y details.suggested_name para mostrar la pantalla de apodo. Creada → 201.
        Si el backend no tiene Client IDs configurados → 503 GOOGLE_AUTH_UNAVAILABLE (falla cerrada).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleAuthRequest' }
      responses:
        '200':
          description: Sesión de cuenta existente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Session' }
        '201':
          description: Cuenta creada con Google
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      summary: Renovar la sesión (AUTH-03)
      description: >-
        Entrega un access token nuevo y ROTA el refresh token (el anterior queda revocado).
        La app lo llama en silencio antes de que venza el access token (15 min) para mantener la sesión viva.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Sesión renovada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Cerrar sesión individual o global
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getMyProfile
      summary: Perfil propio con estadísticas (USR-02)
      description: Caché de 60 s por usuario; se invalida al editar el perfil, crear o unirse a un grupo.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      operationId: updateMyProfile
      summary: Cambiar apodo y/o avatar (USR-03)
      description: >-
        El apodo es único (sin distinguir mayúsculas) y pasa por moderación de texto antes de guardarse
        (falla cerrada: si la moderación no responde, 503). Al menos un campo es obligatorio.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/users/check-nickname:
    get:
      tags: [Users]
      operationId: checkNickname
      summary: ¿El apodo está libre? (USR-06, público)
      description: Sin autenticación ni caché. Límite estricto de 20 consultas por minuto por IP.
      security: []
      parameters:
        - name: nickname
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_.-]{3,24}$' }
      responses:
        '200':
          description: Disponibilidad
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NicknameAvailability' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/groups:
    get:
      tags: [Groups]
      operationId: listMyGroups
      summary: Mis grupos (GRP-02)
      description: Grupos activos del usuario, del más reciente al más antiguo, con my_role y my_points. Caché 60 s.
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Texto contenido en el nombre (sin distinguir mayúsculas).
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Group' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Crear grupo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '201':
          description: Grupo creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/groups/join:
    post:
      tags: [Groups]
      operationId: joinGroup
      summary: Unirse con código de invitación (MEM-01)
      description: >-
        El código no distingue mayúsculas. Entra como member con 100 puntos.
        409 ALREADY_MEMBER, GROUP_LIMIT_REACHED (5 grupos por usuario) o GROUP_FULL (20 miembros).
        Límite de 10 intentos cada 10 minutos por usuario.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinGroupRequest' }
      responses:
        '200':
          description: Ya eres miembro
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/groups/{id}:
    get:
      tags: [Groups]
      operationId: getGroup
      summary: Detalle del grupo con su configuración (GRP-03)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupPathId'
      responses:
        '200':
          description: Grupo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/groups/{id}/members:
    get:
      tags: [Groups]
      operationId: listGroupMembers
      summary: Miembros del grupo con rol y saldo (MEM-02)
      description: Orden de ingreso. q = prefijo del apodo (autocompletar rival). Caché 60 s.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupPathId'
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 24 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/GroupMember' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/contracts:
    post:
      tags: [Contracts]
      operationId: createContract
      summary: Crear contrato en un grupo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContractRequest' }
      responses:
        '201':
          description: Contrato creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/groups/{gid}/contracts:
    get:
      tags: [Contracts]
      operationId: listGroupContracts
      summary: Tablero de retos del grupo (CON-02)
      description: Del más reciente al más antiguo. Caché 30 s que se invalida al crear, aceptar, rechazar o subir evidencia.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, in_progress, voting, fulfilled, cheating, expired, cancelled] }
        - name: mine
          in: query
          required: false
          description: true = solo retos donde soy retador, retado o quien aceptó.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Game'
        - name: q
          in: query
          required: false
          description: Texto en condición, recompensa o juego.
          schema: { type: string, maxLength: 60 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Contract' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Contracts]
      operationId: createGroupContract
      summary: Crear contrato usando el grupo de la ruta
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContractRequest' }
      responses:
        '201':
          description: Contrato creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/contracts/{id}:
    get:
      tags: [Contracts]
      operationId: getContract
      summary: Detalle de un reto (CON-03)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Reto
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/contracts/{id}/accept:
    post:
      tags: [Contracts]
      operationId: acceptContract
      summary: Aceptar un reto y retener la fianza (CON-06)
      description: >-
        Lo acepta el retado (target_type member) o cualquier miembro distinto del retador (target_type group).
        En una transacción: open → in_progress, se descuenta bond_required del saldo del grupo (nunca negativo)
        y se registra bond_lock en el libro de puntos. Responde el reto con my_points (saldo restante).
        402 INSUFFICIENT_POINTS; 403 NOT_CONTRACT_TARGET; 409 CANNOT_ACCEPT_OWN_CONTRACT o INVALID_CONTRACT_STATE
        (ya no está open, venció o cambió de versión).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractActionRequest' }
      responses:
        '200':
          description: Reto aceptado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/InsufficientPoints' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/contracts/{id}/reject:
    post:
      tags: [Contracts]
      operationId: rejectContract
      summary: Rechazar un reto dirigido a mí (CON-07)
      description: Solo el retado de un reto member en estado open. Pasa a cancelled con closed_reason = rejected; no mueve puntos.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractActionRequest' }
      responses:
        '200':
          description: Reto rechazado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/contracts/{id}/evidence:
    get:
      tags: [Evidence]
      operationId: listEvidence
      summary: Evidencias del reto (EVI-03)
      description: >-
        Solo miembros del grupo (jurados incluidos). Fotos con URL del CDN; enlaces con su URL original.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Evidencias aprobadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Evidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Evidence]
      operationId: createEvidence
      summary: Agregar evidencia por enlace o foto
      description: >-
        La primera evidencia aprobada pasa el contrato a voting (CLARIFICACION #30).
        Se admiten hasta 3 evidencias por contrato (#60); la cuarta devuelve 409 EVIDENCE_LIMIT_REACHED.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLinkEvidenceRequest' }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                type:
                  type: string
                  enum: [photo]
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Evidencia moderada y almacenada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Evidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/tournaments:
    get:
      tags: [Tournaments]
      operationId: listTournaments
      summary: Listar torneos de los grupos activos del usuario
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Game'
        - $ref: '#/components/parameters/GroupQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Tournament' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/groups/{gid}/tournaments:
    get:
      tags: [Tournaments]
      operationId: listGroupTournaments
      summary: Listar torneos de un grupo
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Game'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Tournament' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/votes/pending:
    get:
      tags: [Votes]
      operationId: listPendingVotes
      summary: Retos que me toca votar (VOT-01)
      description: >-
        Retos en voting donde soy jurado y aún no voto, del más reciente al más antiguo.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PendingVote' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/contracts/{id}/votes:
    put:
      tags: [Votes]
      operationId: castVote
      summary: Emitir voto de jurado (VOT-02)
      description: >-
        Un voto por jurado, inmutable (legit o cheat, comentario opcional ≤140 moderado). Cuando un lado alcanza el consenso del grupo sobre los jurados asignados, el reto se cierra en una transacción: fulfilled devuelve la fianza (bond_release) y crea el compromiso; cheating pasa la fianza al retador (bond_forfeit). Si todos votan sin consenso, needs_admin = true.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CastVoteRequest' }
      responses:
        '200':
          description: Voto registrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CastVoteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/contracts/{id}/votes/summary:
    get:
      tags: [Votes]
      operationId: getVoteSummary
      summary: Avance de la votación (VOT-03)
      description: >-
        Cuántos votaron y cuántos faltan; el sentido de los votos solo se muestra al cerrar.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Resumen
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/VoteSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/contracts/{id}/votes/resolve:
    post:
      tags: [Votes]
      operationId: resolveVoting
      summary: El administrador decide (VOT-04)
      description: >-
        Solo admin del grupo y solo si no hay jurados, todos votaron sin consenso o venció el plazo de 48 h; si no, 409 VOTING_NOT_FINISHED.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveVotingRequest' }
      responses:
        '200':
          description: Reto resuelto
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContractResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/contracts/{id}/result:
    get:
      tags: [Votes]
      operationId: getContractResult
      summary: Resultado final (VOT-05)
      description: >-
        Con los votos revelados. 409 si la votación sigue abierta.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContractResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/groups/{gid}/points/me:
    get:
      tags: [Points]
      operationId: getMyPoints
      summary: Mi saldo y movimientos (PTS-01)
      description: >-
        Los puntos no tienen valor monetario y no se pueden comprar.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [bond_lock, bond_release, bond_forfeit, reward, tournament_entry, tournament_prize, adjustment] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Saldo y movimientos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MyPoints' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/groups/{gid}/points/ranking:
    get:
      tags: [Points]
      operationId: getPointsRanking
      summary: Ranking del grupo por puntos (PTS-02)
      description: >-
        Caché 60 s.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ranking
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RankingEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/groups/{gid}/commitments:
    get:
      tags: [Commitments]
      operationId: listCommitments
      summary: Compromisos Debo / Me deben (COM-01)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [debo, me-deben], default: debo }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, completion_requested, completed] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Commitment' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/commitments/{id}/complete:
    post:
      tags: [Commitments]
      operationId: completeCommitment
      summary: El acreedor lo marca como cumplido (COM-03)
      description: >-
        Desde pending o completion_requested. 403 NOT_COMMITMENT_PARTY; 409 INVALID_COMMITMENT_STATE.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CommitmentId'
      responses:
        '200':
          description: Compromiso cumplido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Commitment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/commitments/{id}/request-complete:
    post:
      tags: [Commitments]
      operationId: requestCommitmentCompletion
      summary: El deudor pide confirmación (COM-04)
      description: >-
        Solo desde pending; avisa al acreedor.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CommitmentId'
      responses:
        '200':
          description: Solicitud registrada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Commitment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Mis avisos (NOT-01)
      description: >-
        Del más reciente al más antiguo; meta incluye unread_count. Tipos: contract_received, contract_accepted, vote_requested, vote_tie, contract_resolved, commitment_completion_requested, commitment_completed.
      security:
        - BearerAuth: []
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
                      meta: 
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              unread_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/notifications/{id}/read:
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Marcar un aviso como leído (NOT-02)
      description: >-
        404 si no existe o es de otra persona.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200':
          description: Aviso leído
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Marcar todos como leídos (NOT-03)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cuántos se marcaron
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReadAll' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/groups/{gid}/fame:
    get:
      tags: [Fame]
      operationId: getHallOfFame
      summary: Muro de la Fama (ACH-01)
      description: >-
        Retos cumplidos del grupo con quien los cumplió y sus fotos/clips aprobados. Caché 60 s.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/FameEntry' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GroupId:
      name: gid
      in: path
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    CommitmentId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    GroupPathId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    ContractId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    GroupQuery:
      name: group_id
      in: query
      required: false
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    Status:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [open, in_progress, finished, cancelled] }
    Game:
      name: game
      in: query
      required: false
      schema: { type: string, maxLength: 60 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
  responses:
    BadRequest:
      description: JSON inválido o campos desconocidos (INVALID_INPUT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InsufficientPoints:
      description: Saldo de puntos insuficiente para la fianza (INSUFFICIENT_POINTS)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Autenticación requerida o token inválido/revocado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Sin pertenencia o propiedad sobre el recurso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicto de estado o unicidad
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Datos inválidos o contenido rechazado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Límite de solicitudes excedido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Moderación o almacenamiento no disponible (falla cerrada)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Envelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          nullable: true
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details:
          type: object
          nullable: true
    PageMeta:
      type: object
      properties:
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
    RegisterRequest:
      type: object
      required: [email, password, nickname, accept_privacy, privacy_version]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        nickname: { type: string, pattern: '^[A-Za-z0-9_.-]{3,24}$' }
        accept_privacy: { type: boolean }
        privacy_version: { type: string, minLength: 1, maxLength: 32 }
        device_id: { type: string, maxLength: 128, nullable: true }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
        device_id: { type: string, maxLength: 128, nullable: true }
    GoogleAuthRequest:
      type: object
      required: [id_token]
      additionalProperties: false
      properties:
        id_token: { type: string, minLength: 20, maxLength: 4096 }
        nickname: { type: string, pattern: '^[A-Za-z0-9_.-]{3,24}$', description: Obligatorio solo la primera vez }
        accept_privacy: { type: boolean, description: Obligatorio solo la primera vez }
        privacy_version: { type: string, example: '2026-10-01' }
        device_id: { type: string, maxLength: 128 }
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string }
        device_id: { type: string, maxLength: 128, nullable: true }
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token: { type: string, nullable: true }
        all: { type: boolean, default: false }
    Session:
      type: object
      required: [user, access_token, refresh_token, token_type, expires_in]
      properties:
        user: { $ref: '#/components/schemas/User' }
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        nickname: { type: string }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }
    CreateGroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 40 }
        settings: { $ref: '#/components/schemas/GroupSettings' }
    GroupSettings:
      type: object
      additionalProperties: false
      properties:
        jurors: { type: integer, minimum: 1, maximum: 9, default: 3 }
        consensus: { type: number, minimum: 0.51, maximum: 1, default: 0.66 }
        bond_options:
          type: array
          items: { type: integer, minimum: 0 }
    Group:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        owner_id: { type: string }
        invite_code: { type: string, minLength: 6, maxLength: 6 }
        invite_active: { type: boolean }
        member_count: { type: integer }
        settings: { $ref: '#/components/schemas/GroupSettings' }
        my_role: { type: string }
        my_points: { type: integer }
        created_at: { type: string, format: date-time }
    CreateContractRequest:
      type: object
      required: [game, condition, reward, deadline, bond_required]
      additionalProperties: false
      properties:
        group_id: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        game: { type: string, minLength: 1, maxLength: 60 }
        condition: { type: string, minLength: 1, maxLength: 280 }
        reward: { type: string, minLength: 3, maxLength: 80, description: Sin símbolos ni cantidades de dinero }
        deadline: { type: string, format: date-time }
        bond_required: { type: integer, minimum: 0 }
        target_type:
          type: string
          enum: [group, member]
          default: group
          description: member exige target_id de otro miembro del grupo; retarse a sí mismo devuelve 422 INVALID_TARGET.
        target_id: { type: string, nullable: true }
        source: { type: string, enum: [manual], default: manual }
    Contract:
      type: object
      properties:
        id: { type: string }
        group_id: { type: string }
        challenger_id: { type: string }
        target_type: { type: string }
        target_id: { type: string, nullable: true }
        game: { type: string }
        condition: { type: string }
        reward: { type: string }
        deadline: { type: string, format: date-time }
        bond_required: { type: integer }
        status: { type: string, enum: [open, in_progress, voting, fulfilled, cheating, expired, cancelled] }
        accepted_by: { type: string, nullable: true }
        accepted_at: { type: string, format: date-time, nullable: true }
        closed_reason: { type: string, nullable: true, description: 'rejected cuando el retado lo rechazó' }
        executor_id: { type: string, nullable: true, description: Quien debe cumplir el reto (se fija al pasar a voting) }
        jurors_count: { type: integer }
        voting_ends_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, nullable: true, enum: [jury, admin] }
        resolved_at: { type: string, format: date-time, nullable: true }
        evidence_count: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        my_points: { type: integer, nullable: true, description: Solo en la respuesta de aceptar; saldo restante en el grupo }
    ContractActionRequest:
      type: object
      additionalProperties: false
      properties:
        version: { type: integer, description: 'Versión que la app vio; si cambió, 409. Opcional.' }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        nickname: { type: string, pattern: '^[A-Za-z0-9_.-]{3,24}$' }
        avatar_id: { type: string, pattern: '^[a-z0-9_-]{1,32}$' }
    Profile:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        nickname: { type: string }
        avatar_id: { type: string }
        email_verified: { type: boolean }
        stats:
          type: object
          properties:
            completed: { type: integer }
            cheated: { type: integer }
            streak: { type: integer }
            trophies: { type: integer }
            word_index: { type: integer, minimum: 0, maximum: 100 }
        groups_count: { type: integer }
        created_at: { type: string, format: date-time }
    NicknameAvailability:
      type: object
      properties:
        nickname: { type: string }
        available: { type: boolean }
    JoinGroupRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9]{6}$' }
    GroupMember:
      type: object
      properties:
        user_id: { type: string }
        nickname: { type: string }
        avatar_id: { type: string }
        role: { type: string, enum: [admin, member] }
        points_balance: { type: integer }
        joined_at: { type: string, format: date-time }
    CastVoteRequest:
      type: object
      required: [vote]
      additionalProperties: false
      properties:
        vote: { type: string, enum: [legit, cheat] }
        comment: { type: string, maxLength: 140, nullable: true }
    ResolveVotingRequest:
      type: object
      required: [outcome]
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [fulfilled, cheating] }
    CastVoteResponse:
      type: object
      properties:
        contract_id: { type: string }
        vote: { type: string }
        status: { type: string }
